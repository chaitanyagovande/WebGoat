name: Build with Composite Action
on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Maven artifact version to build and push (e.g. 1.0.1, 2.0.0-SNAPSHOT). Leave empty to use version from pom.xml.'
        required: false
        type: string
        default: ''
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for uploading code scanning.
  attestations: write
env:
  JFROG_URL: "https://${{vars.JF_NAME}}.jfrog.io"
  JFROG_USER: "cg-webgoat"
  RESOLVE_REPO: "cg-lab-maven-virtual" 
  DEPLOY_REPO: "cg-lab-maven-virtual" 
  BUILD_NAME: "cg-webgoat"
jobs:
  mvnCompositeAction:
    name: MVN Composite Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_ID: "cg-webgoat-${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - name: Set artifact version
        if: inputs.artifact_version != ''
        run: mvn org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion=${{ inputs.artifact_version }} -DgenerateBackupPoms=false

      - uses: chaitanyagovande/jfrog-maven-actions/maven/setup@main
        with:
          jfrog-url: ${{ env.JFROG_URL }}
          jfrog-user: ${{ env.JFROG_USER }}
          jfrog-oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          #jfrog-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          resolve-repo: ${{ env.RESOLVE_REPO }}
          build-name: ${{ env.BUILD_NAME }}
          build-number: ${{ env.BUILD_ID }}

      - name: "Package: Create MVN Build"
        run: |
          jf mvn clean install -DskipTests -f pom.xml --build-name ${{env.BUILD_NAME}} --build-number ${{env.BUILD_ID}}

      
#      - name: Deploy to Artifactory
#        if: github.ref == 'refs/heads/master'
#        run: mvn deploy -DskipTests

      - uses: chaitanyagovande/jfrog-maven-actions/maven/publish@main
        with:
          jfrog-url: ${{ env.JFROG_URL }}
          jfrog-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          build-name: ${{ env.BUILD_NAME }}
          build-number: ${{ github.run_number }}
          xray-scan: "true"

          xray-fail-on-violation: "false"

