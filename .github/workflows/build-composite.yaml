name: Build with Composite Action
on:
  workflow_dispatch:

permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for uploading code scanning.
  attestations: write
env:
  JFROG_URL: "https://${{vars.JF_NAME}}.jfrog.io"
  JFROG_USER: "cg-webgoat"
  RESOLVE_REPO: "cg-lab-maven-virtual" 
  DEPLOY_REPO: "cg-lab-maven-virtual" 
  BUILD_NAME: "cg-webgoat-by"
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '25'
  DEFAULT_WORKSPACE: "${{github.workspace}}"
jobs:
  mvnCompositeAction:
    name: MVN Composite Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_ID: "cg-webgoat-by-${{ github.run_number }}"
    steps:
      - name: "Install prereqs tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq 
          yq --version
          jq --version

#      - name: Set artifact version
#       if: inputs.artifact_version != ''
#        run: mvn org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion=${{ inputs.artifact_version }} -DgenerateBackupPoms=false
      - name: "Clone VCS"
        uses: actions/checkout@v4 # ref: https://github.com/actions/checkout

      - name: "setUp JDK provider = ${{env.JAVA_DISTRIBUTION}} with ver = ${{env.JAVA_VERSION}}"
        uses: actions/setup-java@v4   # ref https://github.com/actions/setup-java
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}} # temurin
          java-version: ${{env.JAVA_VERSION}}  # 25
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - uses: chaitanyagovande/jfrog-shared-actions/maven/setup@main
        with:
          jfrog-url: ${{ env.JFROG_URL }}
          jfrog-user: ${{ env.JFROG_USER }}
          jfrog-oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          #jfrog-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          resolve-repo: ${{ env.RESOLVE_REPO }}
          build-name: ${{ env.BUILD_NAME }}
          build-number: ${{ env.BUILD_ID }}

      - name: "MVN: Summary"
        run: |
          echo "# :frog: MVN: Summary :pushpin:" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Installed JFrog CLI [$(jf --version)](https://jfrog.com/getcli/) and Java [${{env.JAVA_PROVIDER}}](https://github.com/actions/setup-java) v${{env.JAVA_VERSION}} " >> $GITHUB_STEP_SUMMARY
          echo "    - $(jf --version) " >> $GITHUB_STEP_SUMMARY
          echo "    - $(mvn -v) " >> $GITHUB_STEP_SUMMARY
          echo " - Configured the JFrog Cli and Docker login with SaaS Artifactory OIDC integration  " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Variables info" >> $GITHUB_STEP_SUMMARY
          echo "    - ID: ${{env.BUILD_ID}} " >> $GITHUB_STEP_SUMMARY
          echo "    - Build Name: ${{env.BUILD_NAME}} " >> $GITHUB_STEP_SUMMARY
          echo "    - Maven Repo URL: ${{env.RT_REPO_MVN_VIRTUAL}}" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          # echo " - Evidence Info: " >> $GITHUB_STEP_SUMMARY

      # -Dartifactory.publish.artifacts=false: JFrog extractor must not deploy (it would deploy both thin and exec).
      # We deploy only the thin JAR via Maven deploy phase (maven-deploy-plugin deploy-file).
      - name: "Package: Create MVN Build"
        run: |
          jf mvn clean deploy -DskipTests -Dartifactory.publish.artifacts=false -f pom.xml --build-name ${{env.BUILD_NAME}} --build-number ${{env.BUILD_ID}}

      
#      - name: Deploy to Artifactory
#        if: github.ref == 'refs/heads/master'
#        run: mvn deploy -DskipTests

      - uses: chaitanyagovande/jfrog-shared-actions/maven/publish@main
        with:
          jfrog-url: ${{ env.JFROG_URL }}
          jfrog-oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          #jfrog-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          build-name: ${{ env.BUILD_NAME }}
          build-number: ${{ env.BUILD_ID }}
          xray-scan: "false"
          xray-fail-on-violation: "false"


