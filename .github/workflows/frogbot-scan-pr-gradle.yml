# ---------------------------------------------------------------------------
# Frogbot v2 – Repository scan on push, GRADLE only.
#
# This is the Gradle-scoped counterpart of `frogbot-scan-pr.yml` (the
# Maven-scoped PR scan). It runs on every push to `gradle-support` (or on
# manual dispatch) and uses Frogbot's `scan-repository` mode, which can open
# an aggregated fix-PR for any vulnerable Gradle dependencies it finds.
#
# Scope is constrained to Gradle by activating
# `config/frogbot/gradle-config.yml` (which sets `scan.technologies: [gradle]`)
# – no path exclusions required.
#
# Docs:
#   https://docs.jfrog-applications.jfrog.io/jfrog-applications/frogbot
#   https://docs.jfrog-applications.jfrog.io/jfrog-applications/frogbot/setup-frogbot/frogbot-environment-variables
# ---------------------------------------------------------------------------
name: "Frogbot Scan Repository (Gradle)"
on:
    workflow_dispatch:
    push:
        branches:
            - gradle-support

permissions:
    contents: write        # Frogbot needs this to push the aggregated fix-PR branch.
    pull-requests: write   # Frogbot needs this to open the fix PR itself.
    id-token: write        # OIDC authentication with JFrog.

jobs:
    scan-repository-gradle:
        runs-on: ubuntu-latest
        environment: frogbot
        steps:
            -   name: "Clone VCS"
                uses: actions/checkout@v4

            # Frogbot resolves Gradle dependency trees by invoking ./gradlew,
            # so the runner needs a matching JDK and a populated Gradle cache.
            -   name: "Set up JDK (Java 25)"
                uses: ./.github/actions/java-setup
                with:
                    cache: 'gradle'

            -   name: "Validate Gradle wrapper"
                uses: gradle/actions/wrapper-validation@v4

            # Defensive: in some checkouts (forks, Windows, self-hosted) the
            # executable bit can be lost. Cheap insurance.
            -   name: "Make gradlew executable"
                shell: bash
                run: chmod +x ./gradlew

            # Warm up the wrapper so Gradle's distribution is on disk before
            # Frogbot starts. `--version` does not resolve any dependencies,
            # so no Artifactory credentials are required here.
            -   name: "Warm up Gradle wrapper"
                shell: bash
                run: ./gradlew --version

            # Activate the Gradle-scoped Frogbot configuration. Frogbot reads
            # `.frogbot/frogbot-config.yml`; we copy the right one in place
            # so the same repo can host both maven and gradle scans without
            # them clobbering each other.
            -   name: "Activate Gradle Frogbot config"
                shell: bash
                run: |
                    mkdir -p .frogbot
                    cp config/frogbot/gradle-config.yml .frogbot/frogbot-config.yml

            -   name: "Run Frogbot Repository Scan (Gradle)"
                uses: jfrog/frogbot@v2
                id: frogbot-gradle
                env:
                    JF_URL: ${{ vars.JF_URL }}
                    JF_GIT_TOKEN: ${{ secrets.JF_GITHUB_TOKEN }}
                    JF_INCLUDE_ALL_VULNERABILITIES: "true"
                    JFROG_CLI_LOG_LEVEL: ${{ vars.JF_LOG_LEVEL }}
                    JF_GIT_AGGREGATE_FIXES: "true"
                    JF_WATCHES: "CG_SEC-IDE-bl"
                    # Resolve Gradle dependencies through the JFrog virtual
                    # repo. NOTE: OIDC only authenticates Frogbot itself against
                    # the JFrog platform – the embedded `gradle-dep-tree`
                    # subprocess invokes ./gradlew which uses the credentials
                    # declared in settings.gradle (read from these env vars).
                    JF_DEPS_REPO: "blueyonder-gradle-virtual"
                    ARTIFACTORY_USER:     ${{ secrets.ARTIFACTORY_USER }}
                    ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
                    # Force Frogbot to invoke ./gradlew (not system `gradle`).
                    # build-info-go reads this exact env var; the default is
                    # auto-detect, but being explicit avoids silent PATH fallbacks.
                    JF_USE_WRAPPER: "true"
                    # Skip auto-fix PRs. Frogbot's Gradle rewriter cannot
                    # update versions that live in `ext { ... }` properties,
                    # Spring Boot BOM-managed deps, or transitives – which
                    # applies to xstream, jose4j, spring-boot-starter-*,
                    # tomcat-embed-core, etc. in this build. The scan still
                    # runs and findings are reported via Xray + the GitHub
                    # Security tab; we just don't create fix PRs.
                    JF_SKIP_AUTOFIX: "true"
                with:
                    oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}
